name: sales-snapshot

on:
  schedule:
    # Every 30 minutes, around the clock, at 13,43 past the hour (odd
    # minutes: crons on the hour routinely run late or get dropped; the
    # sibling tool uses other minutes so the two robots never hit Wiise
    # together). The robot decides what each firing does — it fills
    # whichever due slot (Morning 05:00 / Midday 11:00 / Evening 17:00
    # Melbourne) is still missing today's capture, or exits in seconds.
    # No hour filter here on purpose: a plain expression is the one GitHub
    # registers most reliably, and DST needs no special casing.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Force slot (0500 / 1100 / 1700); empty = refresh the most recent slot"
        required: false
        default: ""
      selftest:
        description: "Only test the SharePoint upload/download/delete round-trip (no snapshot)"
        type: boolean
        required: false
        default: false

# Snapshots are published to SharePoint via Microsoft Graph, not to a
# branch — the workflow never needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: sales-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: SharePoint self-test
        if: ${{ github.event.inputs.selftest == 'true' }}
        env:
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_TENANT: ${{ secrets.BC_TENANT }}
          BC_REFRESH_TOKEN: ${{ secrets.BC_REFRESH_TOKEN }}
        run: node scripts/sp-upload.js --selftest

      - name: Build snapshot and publish to SharePoint
        if: ${{ github.event.inputs.selftest != 'true' }}
        env:
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_TENANT: ${{ secrets.BC_TENANT }}
          BC_REFRESH_TOKEN: ${{ secrets.BC_REFRESH_TOKEN }}
          SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
          SLOT: ${{ github.event.inputs.slot }}
        run: node scripts/snapshot.js
