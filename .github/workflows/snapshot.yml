name: sales-snapshot

on:
  schedule:
    # Melbourne 7:00 / 12:00 / 16:30, both AEST (UTC+10) and AEDT (UTC+11)
    # firings. Scheduled ~13 min BEFORE each slot at odd minutes — GitHub
    # crons at the top of the hour routinely run 1-2h late or get dropped.
    # snapshot.js maps the Melbourne wall clock to the nearest slot within
    # a 2h window and skips anything further off.
    - cron: "43 20 * * *"   # 07:00 AEST (fires 06:43 local)
    - cron: "43 19 * * *"   # 07:00 AEDT
    - cron: "43 1 * * *"    # 12:00 AEST (fires 11:43 local)
    - cron: "43 0 * * *"    # 12:00 AEDT
    - cron: "13 6 * * *"    # 16:30 AEST (fires 16:13 local)
    - cron: "13 5 * * *"    # 16:30 AEDT
  workflow_dispatch:
    inputs:
      slot:
        description: "Force slot (0700 / 1200 / 1630); empty = auto-detect"
        required: false
        default: ""
      selftest:
        description: "Only test the SharePoint upload/download/delete round-trip (no snapshot)"
        type: boolean
        required: false
        default: false

# Snapshots are published to SharePoint via Microsoft Graph, not to a
# branch — the workflow never needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: sales-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: SharePoint self-test
        if: ${{ github.event.inputs.selftest == 'true' }}
        env:
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_TENANT: ${{ secrets.BC_TENANT }}
          BC_REFRESH_TOKEN: ${{ secrets.BC_REFRESH_TOKEN }}
        run: node scripts/sp-upload.js --selftest

      - name: Build snapshot and publish to SharePoint
        if: ${{ github.event.inputs.selftest != 'true' }}
        env:
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_TENANT: ${{ secrets.BC_TENANT }}
          BC_REFRESH_TOKEN: ${{ secrets.BC_REFRESH_TOKEN }}
          SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
          SLOT: ${{ github.event.inputs.slot }}
        run: node scripts/snapshot.js
