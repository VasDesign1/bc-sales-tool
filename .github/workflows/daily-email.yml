name: daily-snapshot-email

# The morning sales email (scripts/daily-email.js) to the address(es) in
# the DAILY_EMAIL_TO secret, with DAILY_EMAIL_CC copied in. The script
# picks the email for the day: Monday = last week's summary plus the
# month so far; first working day of a month = the closed month's summary;
# any other weekday = the Daily Snapshot.
#
# Schedule: fires every half hour through the Melbourne morning. The script
# decides what a firing does — it sends ONE email per weekday, as soon as
# today's Morning snapshot is on SharePoint; if that snapshot is still
# missing at 7:30 AM it sends once from the newest snapshot there is
# (normally yesterday's Evening one). Every other firing ends in seconds.
# The hours are UTC and cover 5–11 AM Melbourne in both summer and winter
# time; :25/:55 sits a few minutes after the snapshot robot's own :13/:43.
#
# Run workflow (by hand): always sends, from the newest snapshot or the
# slot typed in, and does not count as the day's email.
on:
  schedule:
    - cron: "25,55 17-23,0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the email but do not send it"
        type: boolean
        required: false
        default: false
      slot:
        description: "Snapshot slot to use (0500 / 1100 / 1700); empty = the newest"
        required: false
        default: ""
      kind:
        description: "Which email: daily / weekly / monthly / monthly+weekly (empty = what the day calls for)"
        required: false
        default: ""
      as_of:
        description: "TEST: build it as if it were this morning, YYYY-MM-DD (goes to the first address only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-snapshot-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 22: the script drives headless Chrome over the built-in WebSocket.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only needed for the AI commentary; without the ANTHROPIC_API_KEY
      # secret the email simply goes out without it.
      - name: Install the Claude SDK
        run: npm install --no-save --no-audit --no-fund @anthropic-ai/sdk

      - name: Build and send the morning email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_TENANT: ${{ secrets.BC_TENANT }}
          BC_REFRESH_TOKEN: ${{ secrets.BC_REFRESH_TOKEN }}
          SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
          DAILY_EMAIL_TO: ${{ secrets.DAILY_EMAIL_TO }}
          DAILY_EMAIL_CC: ${{ secrets.DAILY_EMAIL_CC }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SLOT: ${{ github.event.inputs.slot }}
          EMAIL_KIND: ${{ github.event.inputs.kind }}
          EMAIL_AS_OF: ${{ github.event.inputs.as_of }}
        run: node scripts/daily-email.js
